# ── live-e2e (D-266 · نطاقٌ مُصحَّح في ISS-199) ────────────────────────────────
#
# النطاق الحقيقي: `workflow_dispatch` **و** `workflow_call`. و`ci.yml` يستدعيها في كل
# دفعة باسم `live-e2e-required`، وهي **داخل** `required-ci` (في `needs` وفي سلسلة
# `isValid` معاً). ⚠️ كان هذا الرأس يقول نقيضَ ذلك حتى 2026-08-30: أضافت `3176fe6`
# الاستدعاء والوصل و`diff`ها على هذا الملفّ يبدأ عند `@@ -25` — أي أنّها **لم تلمس
# الرأس**، فبقي وعدٌ يفارق تنفيذه. وهو صنف ISS-198 نفسه، وقاعدة D-188 تحكمه.
#
# وماذا يحجب وماذا يُبلِّغ (ISS-199):
#   • يحجب **عقدَنا** — إطارٌ نهائيّ واحد لكل دور (§6.5) · لا نصّ نظامٍ يصل الطالب
#     (D-117/D-229) · لا دورَ صامت · لا مكوّنٌ لا تعرف الواجهة رسمه · ولا يُشغَّل
#     أعمى بلا أسرار.
#   • يُبلِّغ ولا يحجب ما كان **مؤجَّلاً بتصريح** في `scripts/e2e/deferred_findings.py`
#     — بلاغٌ 🔴 مفتوحٌ بقرارٍ مكتوبٍ بتأجيله (اليوم: ISS-150 وحده). ⛔ والتأجيل ليس
#     إخفاءً: المخالفة تُطبَع بنصّها في كل تشغيل، ويتغيّر رمز الخروج وحده. تحرس
#     السجلَّ `check_e2e_deferred_findings.py`، فبلاغٌ أُغلق وبقي مؤجَّلاً ⇒ CI أحمر.
#
# ولماذا لا تُترَك حاجبةً على كل شيء: بوّابةٌ مُوجَّهةٌ إلى عطبٍ قرّر المستودع تأجيله
# لا تحرس ضدّ انحدار — تمنع **كلّ** دفعة بالبناء. وهو ما وقع فعلاً: خمسة تشغيلاتٍ
# حمراء متتالية على `main`. وذلك هو الخطر الذي حذّر منه رأس `repo-sync.yml` حرفيّاً
# («failing every commit … trains people to ignore the job») ووقع في ISS-197.
#
# ولماذا تُسلَّم أصلاً: منفذا Postgres (6543/5432) محجوبان من حاويات التطوير — أُثبت
# ذلك بقياسٍ حيّ (timeout). وعدّاء GitHub شبكتُه مفتوحة، فهو الموضع الوحيد الذي
# يستطيع إثبات الرحلة على **قاعدة الإنتاج** بعينها.
#
# ⛔ **لا يُشغَّل بلا أسرارٍ مضبوطة.** وظيفةٌ تمرّ لأن السرّ غائب هي بالضبط «الصمت
# يُقرأ نجاحاً» الذي يحظره D-207 — فالخطوة الأولى تفشل صراحةً وتسمّي السرّ الناقص.
#
# الأسرار المطلوبة (تُضبَط من إعدادات المستودع):
#   DATABASE_URL · OPENROUTER_API_KEY · TAVILY_API_KEY
#   E2E_STUDENT_EMAIL · E2E_STUDENT_PASSWORD · SECRET_KEY · HONCHO_API_KEY
name: live-e2e

on:
  workflow_dispatch:
    inputs:
      matrix_only:
        description: "شغّل مصفوفة «يجيب على كل سؤال» وحدها (بلا رحلة الطالب)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      matrix_only:
        description: "شغّل مصفوفة الإجابة وحدها (للاستخدام اليدوي فقط)"
        type: boolean
        required: false
        default: false
    secrets:
      DATABASE_URL:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TAVILY_API_KEY:
        required: true
      E2E_STUDENT_EMAIL:
        required: true
      E2E_STUDENT_PASSWORD:
        required: true
      SECRET_KEY:
        required: true
      HONCHO_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    name: live-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # D-268: الأسماء الظاهرة هنا (DIAG_*) هي المفاتيح التي تقرأها سكربتات الاختبار
      # الحيّ في عدة أماكن — تغييرها يخالف عقودها المكتوبة. المصدر الجذري في Secrets
      # هو E2E_STUDENT_EMAIL/E2E_STUDENT_PASSWORD (انظر `aliases` في الكتالوج).
      DIAG_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      DIAG_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      # D-268/D-269 — طبقة الهوية المعرفية المحيطة. اختياريّ عمداً: غيابه يجعل
      # المسبار يُبلِّغ `not_configured` ولا يُفشِل الرحلة، لأنه ليس على مسار
      # إجابة الطالب. ولذلك هو **خارج** حارس «Refuse to run blind» أدناه —
      # الحارس لأسرارٍ بلا واحدٍ منها تصير الوظيفة كذباً، لا لكل سرٍّ مُعلَن.
      HONCHO_API_KEY: ${{ secrets.HONCHO_API_KEY }}
      ENVIRONMENT: development
      LLM_MOCK_MODE: "0"
      # D-280: gpt-oss-20b:free was removed from the public catalog (404).
      # Use a currently listed, previously Arabic-validated free model for this
      # live probe, and append a current free-tier recovery slot. The probe still
      # fails closed if the model cannot answer the full matrix.
      OPENROUTER_PRIMARY_MODEL: google/gemma-4-31b-it:free
      OPENROUTER_EXTRA_MODELS: nvidia/nemotron-3.5-lightning:free
      REQUIRE_ORCHESTRATOR: "0"
      E2E_BACKEND: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      # الصمت لا يُقرأ نجاحاً: سرٌّ ناقص ⇒ فشلٌ صريح يسمّيه، لا تخطٍّ صامت.
      - name: "Refuse to run blind"
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in DATABASE_URL OPENROUTER_API_KEY TAVILY_API_KEY DIAG_EMAIL DIAG_PASSWORD SECRET_KEY HONCHO_API_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::أسرارٌ ناقصة: ${missing[*]} — اضبطها في إعدادات المستودع."
            exit 1
          fi
          echo "✅ كل الأسرار المطلوبة حاضرة."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Normalize Tavily secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          raw="${TAVILY_API_KEY:-}"
          if [[ "$raw" == *"tavilyApiKey="* ]]; then
            raw="${raw##*tavilyApiKey=}"
            raw="${raw%%&*}"
          fi
          [ -n "$raw" ] || { echo '::error::TAVILY_API_KEY is empty after normalization'; exit 1; }
          echo "::add-mask::$raw"
          echo "TAVILY_API_KEY=$raw" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # D-288: اسأل الكتالوج الحيّ قبل أن تُقلع الرحلة. خطأ المزوّد (404/402) كان يهبط
      # بكل ردود الطالب إلى رسالة اعتذار واحدة في أقل من ثانية، والحارس الأخضر
      # (test_ai_config) لا يراه لأنه يفرض PRIMARY بالقوة. المسبار يقرأ السلسلة كما يقرأها
      # الدماغان — تجاوز المشغِّل ثم الذيل ثم OPENROUTER_EXTRA_MODELS — فيسلّك ادّعاء D-280
      # («ذيل التعافي مثبَّت») أخيراً.
      # والفارق المُتعمَّد (دَينُ ISS-199): الموتُ **المقطوعُ به** يُفشِل، والعَمى (شبكة · 429 ·
      # 5xx) يُبلَّغ ولا يُفشِل — بوّابةٌ تُحمِّر CI لانقطاعٍ لا تراه تُعلِّم الجميع تجاهلها.
      # من يريد رفض التشغيل بلا رؤية يشغّل --strict. والمفتاح: 401 خطأٌ قاطع، أمّا 403
      # فسؤالٌ لجدارٍ أماميّ لا لمفاتيحنا — تحذيرٌ، واليقينُ في أول استدلالٍ حقيقيّ.
      - name: "Live model registry probe (D-288)"
        run: |
          set -euo pipefail
          python scripts/verify_model_registry_live.py --check-key | tee /tmp/registry-probe.txt
          if grep -q "لا حكم" /tmp/registry-probe.txt; then
            echo "::warning::سجلّ النماذج لم يُقرأ من هذا المشغِّل — لا حكم، ولا خُضرةَ تُصدَّق."
          fi

      - name: Boot the monolith against production Supabase
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 3
          done
          # `/health` صادقٌ أو لا شيء (D-245): نقرأ الجسم لا وجود العملية.
          cat /tmp/health.json
          python -c "import json,sys;h=json.load(open('/tmp/health.json'));bad=[k for k in ('application','database') if h.get(k)!='ok'];sys.exit('::error::/health غير صادق: '+str({k:h.get(k) for k in bad})) if bad else print('✅ /health صادق: application=ok database=ok')"

      # D-269: الساق الثالثة من البرهان الثلاثي للطبقة الخامسة. `--require` عمداً:
      # المالك ضبط السرّ بهذا الاسم، فغيابُه هنا يعني اسماً خاطئاً لا طبقةً اختيارية
      # — والصمت لا يُقرأ نجاحاً (D-207). ⛔ ولا بيانات طالبٍ في هذا النداء.
      - name: "Ambient identity layer live probe (D-269)"
        run: python scripts/e2e/honcho_live_probe.py --require

      - name: "Universal answerability matrix (D-266 · ISS-159)"
        run: python scripts/e2e/universal_answerability_live.py --base http://127.0.0.1:8000

      - name: "Student journey (D-232)"
        if: ${{ !inputs.matrix_only }}
        run: |
          python scripts/e2e/live_student_journey.py \
            --base http://127.0.0.1:8000 \
            --email "$DIAG_EMAIL" --password "$DIAG_PASSWORD"

      - name: "Backend log (always — a green run still owes its evidence)"
        if: always()
        # `if: always()` تعني أنّ هذه الخطوة ستُجرى حتى بعد موت الرحلة مبكراً — فحيث
        # لا يوجد ملفٌّ بعدُ يجب أن يقول «لا دليل» لا أن يُخرج 1 ويُضيف سبباً كاذباً
        # إلى جانب السبب الحقيقيّ (حدث هذا في أول تشغيلٍ CIّ لهذا الملفّ).
        run: |
          if [ -f /tmp/backend.log ]; then
            tail -n 120 /tmp/backend.log
          else
            echo "::warning::لا /tmp/backend.log — ماتت الرحلة قبل إقلاع الخادم؛ السبب في الخطوات أعلاه."
          fi
