name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup
      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # D-184: Ruff MUST be pinned. The old floating range ("ruff>=0.6,<1")
          # silently upgraded the linter on every run, so a new stable rule turned
          # `main` red without a single line of code changing: ruff 0.16 promoted
          # PLR0917 (too-many-positional-arguments) and flagged 69 pre-existing
          # signatures, which is why `required-ci` has been failing since 2026-07-23
          # while every other job stayed green. A lint tool that changes underneath
          # the repo is not a gate, it is a coin flip — pin it and bump on purpose.
          pip install "ruff==0.14.0"
          # D-192 (roadmap §6.5.د D2): mypy was configured near-strict in mypy.ini,
          # listed in requirements-dev.txt, wired into pre-commit — and absent from
          # all 10 workflows, with `Makefile` running it behind `|| true`. A type
          # checker that cannot fail is a slogan. Pinned for the same reason ruff is.
          # `mypy.ini` enables the pydantic plugin, which mypy imports at startup —
          # so pydantic must be present in the lint job or mypy exits 2 before
          # checking a single file. Caught by CI on the first run; the local venv
          # had pydantic already, which is exactly the drift a pinned, explicit
          # install prevents.
          # `httpx` is needed too: `shared/http_client/correlated.py` imports it, and
          # without the real package mypy reports both an unresolved import and a
          # spurious "unused type: ignore" on the line that exists precisely because
          # the import *does* resolve. Checking a module means installing what it uses —
          # the alternative (--ignore-missing-imports) would hide real errors.
          pip install "mypy==1.8.0" "types-PyYAML" "types-requests" \
            "pydantic>=2.11.5,<3.0.0" "pydantic-settings>=2.4.0,<3.0.0" "httpx==0.27.0"
      - name: Ruff lint
        shell: bash
        run: |
          set -euo pipefail
          ruff check .
      - name: Ruff format check
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check .
      # Scoped deliberately: `shared/` (zero Any) and `app/integration/` (the ACL
      # boundary, typed to zero Any in D-192) are the clean beachhead. The scope
      # grows by shrinking debt, never by loosening mypy.ini. `--follow-imports=silent`
      # keeps errors attributable to the checked trees instead of their dependencies.
      # First run already paid for itself: it caught `planning_client.generate_plan`,
      # a method that does not exist, called on every planning-gateway invocation.
      - name: Mypy (shared/ + app/integration/)
        shell: bash
        run: |
          set -euo pipefail
          mypy --config-file mypy.ini --follow-imports=silent shared/ app/integration/

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup
      - name: Install contract dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pytest==7.4.4" SQLAlchemy pydantic PyJWT passlib bcrypt
      - name: Validate contracts and provider parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fitness/check_gateway_provider_contracts.py
          python -m pytest -q tests/contracts/test_gateway_provider_contracts.py

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v7
        with:
          # D-277: the acceptance packet compares the PR diff to the base SHA.
          # A shallow checkout cannot resolve base...HEAD, so fail-closed validation
          # would crash before checking the packet at all.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: ./.github/actions/setup
      - name: Install guardrail dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Documentation contract (mandatory)
        shell: bash
        run: |
          set -euo pipefail
          # Live documentation is part of the required acceptance surface.
          # A documentation failure must fail required-ci, not merely annotate a PR.
          python scripts/fitness/check_documentation_contract.py

      - name: Run architectural guardrails
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci_guardrails.py
          # ADR-013: the mandatory reference backbone is pinned, additive, and
          # non-runtime. Removing or silently replacing a source is a hard failure.
          python scripts/fitness/check_reference_backbone.py
          # D-275/D-276: every agent must see the same authority graph, and every
          # repository URL must have a visible adoption status and owner.
          python scripts/fitness/check_agent_context.py
          python scripts/fitness/check_source_adoption_matrix.py
          # D-279: engineering evidence and foreign-currency production evidence
          # must meet before a capability can advance.
          python scripts/fitness/check_dual_track_alignment.py
          # D-273: the deep-tech / hard-currency constitution. It was on disk,
          # declared in CLAUDE.md §0.25 as wired, and executed by nothing — the
          # ISS-186 class (a gate that reads as protection but enforces nothing).
          python scripts/fitness/check_deep_tech_constitution.py
          # D-267 §3.1: the verifier's dependency map was prose. This turns it into a
          # contract — and enforces the D-187 lock structurally (no sandbox executor
          # or network client inside the product path before M1→M4).
          python scripts/fitness/check_naas_verifier_boundary.py
          # D-267 GATE_B: the exploit corpus is derived from the incident archive, never
          # hand-copied — a renamed incident must fail the build, not drift silently.
          python scripts/research/extract_incident_corpus.py --check
          # D-277: no agent code change passes without standards, evidence,
          # production, commercial, and zero-deletion acceptance proof.
          # The packet fingerprint is compared with the PR/push diff, not only
          # the clean checkout, so a stale packet cannot pass remotely.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CODE_ACCEPTANCE_BASE_SHA="${{ github.event.pull_request.base.sha }}" python scripts/fitness/check_code_acceptance.py
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CODE_ACCEPTANCE_BASE_SHA="${{ github.event.before }}" python scripts/fitness/check_code_acceptance.py
          else
            python scripts/fitness/check_code_acceptance.py
          fi
          python scripts/fitness/check_no_app_imports_in_microservices.py --strict
          python scripts/fitness/check_route_registry_parity.py
          python scripts/fitness/check_tracing_gate.py
          # D-105 (ISS-113): بوابة نظافة الاختبارات — تمنع تسميم sys.modules/os.environ
          # على مستوى الوحدة في أي ملف يجمعه pytest (فئة البق التي أسقطت CI).
          python scripts/fitness/check_test_hygiene.py
          # D-173: table-driven replacement for the deleted single-issue/step
          # workflows — every fatal grep assertion they carried lives here.
          python scripts/fitness/check_legacy_invariants.py
          # D-174: cross-brain model-chain parity — proves the monolith brain and
          # the orchestrator brain both match the canonical shared model chain
          # (shared/ai_models/model_chain.py). Turns the D-013 prose mirror rule
          # into a machine-enforced single source of truth.
          python scripts/fitness/check_model_chain_parity.py
          # D-176: turn convention-only boundary gates into
          # machine enforcement (were present but wired nowhere), plus the new
          # anti-ZOMBIE-for-abstraction gate (every hexagonal port is driver-backed
          # or explicitly dormant-allowlisted).
          python scripts/fitness/check_no_cross_service_imports.py
          python scripts/fitness/check_ports_consistency.py
          python scripts/fitness/check_single_brain_control_plane.py
          python scripts/fitness/check_core_kernel_acl.py
          python scripts/fitness/check_abstraction_consumed.py
          # D-185 (ISS-138): the system must be able to define every symbol it prints,
          # and the notation registry must have exactly one canonical source.
          python scripts/fitness/check_notation_definable.py
          python scripts/fitness/check_notation_parity.py
          # D-186 (ISS-139): student intent has exactly one canonical source. Three
          # consecutive catastrophes shared one root — several marker lists for the
          # same intent drifting apart — so a sixth list must be impossible, not
          # merely discouraged. The remaining duplicates are frozen and shrink-only.
          python scripts/fitness/check_intent_single_source.py
          # Complexity budgets for the orchestrator API layer. CodeScene measured
          # `chat_with_agent_endpoint` at 336 LOC / complexity 48 / change frequency 43
          # — the repo's worst hotspot, and 21% of routes.py in one function. But an
          # external SaaS reports after the merge and cannot fail a PR, so the number
          # that no machine guards IN the merge path comes back with the first urgent
          # PR. Three mechanisms: explicit budgets for named functions, a bidirectional
          # shrink-only frozen debt (which also freezes the two WS twins so they cannot
          # grow), and a default budget for anything NOT in the debt — so trading a
          # God-function for a God-module is measured, not assumed away. It caught
          # exactly that during the extraction itself.
          python scripts/fitness/check_endpoint_complexity.py
          # ISS-156: the producer must not serialize what the transport serializes.
          # `_make_json_event` returned `json.dumps({...}) + "\n"` and the endpoint
          # wrapped it again — 32 of 34 frames on a live full stack carried a whole
          # frame inside `payload.content`, and `customer_messages` stored the
          # envelope instead of the student's answer. 1296 green tests missed it
          # because the test double emitted raw text, a shape the agent never
          # produces. Two laws, both structural: producers don't serialize, and the
          # boundary guard cannot be deleted in silence.
          python scripts/fitness/check_no_double_encoded_frames.py
          # ISS-157: the orchestrator's LLM client hardcoded the model D-067 bans as
          # PRIMARY (ISS-079), with no fallback chain, and no deployment overrides it —
          # so the banned model was what actually ran. check_model_chain_parity scanned
          # only the two ai_config.py files while a third held the same decision: an
          # enforcer aimed narrower than its rule, the defect class of ISS-148.
          python scripts/fitness/check_model_client_literals.py
          # D-206 (ISS-141 · L6): the scope a student asks for ("the first question
          # only") has exactly one canonical source. It was spread across seven lists
          # in six files, and not one of them knew the indefinite «اول» — so a student
          # asked three times and never got it. An eighth list must be impossible.
          python scripts/fitness/check_exercise_scope_single_source.py

      - name: Run architectural guardrails (part 2)
        shell: bash
        run: |
          set -euo pipefail
          # D-206 (L5): logic that decides the fate of a student's turn must not live
          # in two brains without guarded parity. The monolith and the orchestrator
          # held the same tutoring-step markers by hand, and they had already drifted:
          # only the service recognised the opening probe as a tutoring step, so the
          # monolith could re-emit a probe it had just sent. Values, not bytes.
          python scripts/fitness/check_probability_brain_parity.py

      - name: Run architectural guardrails (part 3)
        shell: bash
        run: |
          set -euo pipefail
          # D-206 (L8): the mediator does not announce itself. Production showed
          # «سنشرح الآن …» followed by an EMPTY assistant row -- an agenda announced
          # and then nothing delivered. Generalises D-117 from one banned phrase to
          # the class. AST over string literals only: the first, text-based version
          # rejected the very comment explaining the ban.
          python scripts/fitness/check_no_self_announcement.py

      - name: Run architectural guardrails (part 4)
        shell: bash
        run: |
          set -euo pipefail
          # D-189 (roadmap §6.5.د D4): outbound HTTP carries a correlation id. The
          # roadmap measured 31 direct httpx.AsyncClient constructions against 21
          # header injections in 9 files — two thirds of cross-service calls crossed
          # a boundary untraceable. Worse, some injection sites minted a *fresh*
          # uuid4 per call, cutting the trace chain instead of extending it. The
          # remaining direct constructions are frozen and shrink-only.
          python scripts/fitness/check_correlated_http.py
          # M0 (roadmap §6.5.ب): application code executes an argv list, never a shell.
          # The old guard was a denylist next to a never-referenced allowlist, and a live
          # probe showed every attack passing — including `echo $(id -u)` returning 0.
          # A denylist is structurally wrong here: it can never enumerate every dangerous
          # form. argv + shell=False makes injection unrepresentable instead of filtered.
          python scripts/fitness/check_no_shell_true.py
          # D-236 (ISS-152): the backend emitted `message`, every login screen read
          # `detail`, and nothing noticed. So `.detail` was `undefined` on every error
          # and the student saw the literal English string 'Login failed' — 401, 429,
          # 422 and 500 all rendered identically, with the real reason discarded.
          # Measured live before the fix: `HAS 'detail' KEY: False` on a real 401.
          # A contract declared by one half and read by the other needs a gate, not a
          # convention; this one also bans English fallback strings from reaching an
          # Arabic-speaking student.
          python scripts/fitness/check_error_contract_parity.py

      - name: Run architectural guardrails (part 5)
        shell: bash
        run: |
          set -euo pipefail
          # D-201: the topic registry, the AsyncAPI contract and the compose bootstrap
          # are three views of one truth, and three views drift. A topic in code with
          # no channel is invisible to external consumers; a channel with no topic is a
          # contract promising something nobody publishes. Both directions are guarded,
          # and every topic must be created explicitly — `auto.create.topics.enable`
          # lets one typo mint a topic nobody consumes, which then swallows messages in
          # silence until retention expires.
          python scripts/fitness/check_topic_contract_parity.py
          # D-202: the "no reasoning-only model as PRIMARY" rule was a comment at the top
          # of a file, and a comment stopped nothing — ISS-079 put a model returning
          # content=None at the head of the chain and a real student read "pepepe aaaa".
          # Capability is now declared data with dated live evidence, and eligibility is
          # a checked precondition rather than a remembered convention.
          python scripts/fitness/check_model_registry.py

      - name: Run architectural guardrails (part 6)
        shell: bash
        run: |
          set -euo pipefail
          # D-203: the Socratic redaction policy (D-113) is enforced by TWO brains with
          # two implementations of the same D-114 decision. If one regex drifts, one path
          # redacts the final answer and the other leaks it — and the student has no idea
          # which brain answered. D-013's "edit both copies" rule has already been proven
          # breakable; this is the automated version of it.
          python scripts/fitness/check_redaction_parity.py

      - name: Run architectural guardrails (part 7)
        shell: bash
        run: |
          set -euo pipefail
          # D-199: أوّل بوّابة في هذا المستودع تلمس CSS/JSX. من ٤١ بوّابة لم تكن واحدة
          # تحرس الواجهة، فبلغت `globals.css` ٣٥٨٤ سطراً بـ٣٨ قيمة مسافة و٣٠ حجم خطّ —
          # لا بقرار بل لأنّ لا شيء منع التراكم. تفحص أيضاً تباين WCAG AA حسابياً، فلا
          # ينزلق التباين خلسةً إلى ما دون العتبة.
          python scripts/fitness/check_design_tokens.py

      - name: Run architectural guardrails (part 8)
        shell: bash
        run: |
          set -euo pipefail
          # D-191 (ISS-140 ج/د/د-2): the exercise under discussion has exactly one
          # source, and it is the student's own text first. The canonical retrieval
          # literal was copy-pasted at 7 sites feeding 12 call sites, and
          # `_load_canonical_combinations` threw away the `question` it was given —
          # so a student who wrote their own bag was taught someone else's numbers.
          # The gate also asserts that a visual promise follows a *delivered* payload.
          python scripts/fitness/check_exercise_context_single_source.py
          # ISS-141 item 4: "secrets come from the environment only" was prose with no
          # enforcement — exactly the class of rule that drifts silently (D-188). The
          # tree was cleaned in d3fa566; this keeps it clean. Frozen debt is empty.
          python scripts/fitness/check_no_committed_secrets.py
          # D-235: CI plumbing is code, and the wizard PRs that overwrite it are not
          # reviewed like code. Qodana Cloud's generated template reverted the D-234
          # hardening THREE times (2cbab01 · 065b13f · f4b3b40), restoring checkout@v3,
          # `contents: write` and the missing token guard on each merge. Meanwhile
          # `codescene-coverage` skipped its upload on every run since it was written
          # and still reported success. Both rules were already written, in comments,
          # inside the very files that lost them.
          python scripts/fitness/check_ci_workflow_hygiene.py
          # C9 (D-192): a fitness gate that gated nothing — present in scripts/fitness
          # but wired into no workflow. Documentation that cannot fail is decoration.
          python scripts/fitness/check_docs_runtime_parity.py
          # D-192 (roadmap §6.5.د D1): integration boundaries carry no `Any`, and the
          # remaining debt shrinks only. The boundary is the last place to lose contract
          # safety — and the gateway layer was *widening* types the client had narrowed.
          python scripts/fitness/check_no_new_any.py
          # D-192 (roadmap §6.5.د D6): `app/` is a gateway, not a second brain. The
          # 662-line WS handler is frozen at its current domain-call count, not rewritten
          # — decomposing the live student path does not belong in this round.
          python scripts/fitness/check_router_domain_logic.py
          # D-205: every image this repo can build is declared in
          # config/image_build_matrix.json, and `images-build` builds all of them.
          # Before this, nothing in CI ever ran `docker build` — production day would
          # have been the first one. A build gate only covers what it knows about, so
          # a compose build context or a microservices/*/Dockerfile with no entry
          # fails here rather than quietly falling out of coverage.
          python scripts/fitness/check_image_matrix_parity.py
          # ISS-148: every deterministic turn stage must be reachable by a
          # transcript contract. The ISS-144 contract passed green while a
          # student was being handed the whole solution, because the leaking
          # builders lived in `_stage_escape_hatch` — four stages past where
          # the harness stopped. A safety net nobody can see the hole in is
          # worse than none: it buys confidence without coverage.
          python scripts/fitness/check_transcript_stage_coverage.py
          # ISS-148: `_build_symbolic_reveal` skips what the student was
          # already shown — but only if `delivered` is passed, and 7 of its 8
          # call sites forgot. A parameter seven callers forget is not a
          # safeguard; it is a defect spread across call sites.
          python scripts/fitness/check_symbolic_reveal_ledger.py
          # ISS-149: an understanding marker must be a phrase describing the
          # mechanism, never the concept's own name. `favorable_cases` declared
          # "البسط" as proof of understanding, so a student *asking* "كيف نفرق
          # بين البسط و المقام؟" matched it, was scored as having mastered the
          # concept, and the next "لم أفهم؟" was answered with "أحسنت ✅ — يبدو
          # أنك أمسكت الفكرة" while the cognitive model recorded understood.
          # Whoever asks about a thing necessarily names it: the name is the
          # worst possible evidence of understanding it.
          python scripts/fitness/check_understanding_evidence.py
          # ISS-149: thirteen gates returned "zero violations" for a file they
          # could not parse — `except SyntaxError: return []`. Among them the
          # shell-injection guard whose frozen debt is zero, the single-intent
          # source, and the outbound-trace gate: the checks the constitution
          # leans on hardest could pass green over a tree they never read. The
          # doctrine names this the third price — silence read as success — and
          # it was living inside the enforcers themselves.
          python scripts/fitness/check_gate_parse_honesty.py
          # ISS-148: the CS knowledge map is a contract, not a poster. Every
          # claimed status must point at a file that actually exists, so an
          # aspirational ACTIVE cannot survive a rename or a deletion.
          python scripts/fitness/check_cs_knowledge_map.py
          # D-209: the same contract applied to the agentic orchestration
          # layers. The map it guards had drifted for five weeks and carried a
          # hand-written count of a moving quantity — the D-192 defect class,
          # in the one document an agent reads to learn the system's shape.
          # It also forbids a second status ladder: the law document fails if
          # it carries a status column, because two maps of one system is how
          # ISS-139 happened (three lists for one intent, agreeing on nothing).
          python scripts/fitness/check_agentic_orchestration.py
          # D-210: the same law/state contract applied to the value & revenue layer.
          # This one adds the direction no other gate covers: a unit declared ABSENT
          # that HAS code fails too. Every existing gate guards "claimed present but
          # missing"; the reverse means live code with no guard, no test and no
          # review — worse than the declared absence. It also keeps the planned-gate
          # list honest in both directions: a gate named "future" that now exists is
          # a document understating its own guarding, so that fails as well.
          python scripts/fitness/check_revenue_doctrine.py
          # D-224: the cognitive execution engine's 13 layers, plus the one clause
          # that is not documentation at all -- the D-187 interlock. The sandbox is
          # built and runs python/pip/git/npm; the distance between "capability" and
          # "security incident" is a single import line an enthusiastic agent adds
          # months from now, on a platform serving minors. Every prose rule in this
          # repo has been broken at least once (D-013 is the documented case), so
          # the lock is enforced by AST: any module importing both the sandbox
          # executor and an LLM client fails, and exemptions must state a reason.
          python scripts/fitness/check_cognitive_execution.py
          # D-226: root-cause diagnosis must read the canonical prerequisite graph.
          # Measured at discovery: 26 curriculum prerequisite edges, 10 misconception
          # edges, intersection ZERO -- and diagnose_root read only the second. The
          # chain limits -> derivatives -> ... -> logarithm was structurally
          # invisible. Worse than a misclassification: reading the wrong graph makes
          # the engine SILENT, and None reads as "no root" rather than "did not look".
          python scripts/fitness/check_prerequisite_single_graph.py
          # D-227: the credibility limit. "reads minds", "100% accuracy", "zero
          # errors", "will change humanity" are banned in published docs -- an
          # unfalsifiable claim is a debt, not ambition: believed once, discovered,
          # and everything true falls with it. Also blocks temporal claims while the
          # curriculum registry has no term/month field (the ban lifts by itself when
          # the field lands, because the gate checks data rather than opinion).
          python scripts/fitness/check_cognitive_twin.py
          # D-228/D-229: two research doctrines entered the constitution (Harness
          # Engineering; memory in ultra-complex systems). Law lives in
          # docs/architecture/*_DOCTRINE.md, state in .memory/*_truth.md -- a status
          # token inside a law doc is red, an empty gap cell is red (blank reads as
          # success), a cited gate that does not exist is red (ISS-148's class).
          python scripts/fitness/check_research_doctrines.py
          # D-229 (ISS-146): the platform poisoned its own episodic memory --
          # "[pedagogical directive] ..." was written to production with role=user
          # 28 times, so system instructions were stored as if the STUDENT said them
          # and re-read for weeks as conversation evidence (MINJA's delayed-trigger
          # shape). One home for the marker list, and every message write passes the
          # guard. Frozen debt is EMPTY and shrinks in both directions.
          python scripts/fitness/check_no_system_text_as_user.py
          # D-230 (ISS-145): the constitution's FIRST pillar -- "the student
          # manipulates objects, does not read a wall of text" -- was the only law
          # with no enforcer, and it decayed unseen: 9.7% of production replies carry
          # an interactive object, trending 36.6% (June) -> 6.2% -> 3.4% (August).
          # Three registries must agree: the server contract, the renderer registry,
          # and what the builders actually emit. A name on one side only is a
          # half-declared contract (D-192's bug). A declared name with no emitter
          # anywhere is a zombie declaration and must be spoken as debt -- that is
          # bkt_hint_display (105 production rows) and learning_path_card (39), whose
          # emitters were removed while the declarations stayed.
          python scripts/fitness/check_ui_component_parity.py
          # D-263 (2026-08-16 · decision of the owner · ISS-174→ISS-177): the
          # pedagogy-engine constitution. Not another law-of-the-constitution
          # gate: this is the constitution OF the pedagogical mind — "the
          # architecture is not the feature". It guards ten non-negotiable laws
          # (L1–L10): the symbolic engine decides and the LLM only speaks;
          # no raw tutorial loop over the local graph; the three minds carry a
          # confusion guard; the student model is live (BKT + illusion gap,
          # statistical); every intervention carries an auditable reason;
          # long-term learning memory before UI features; and no Learning-Gain
          # claim without a published pre/post/baseline methodology. Law in
          # `.memory/pedagogy_engine_constitution.md`, state in the truth file;
          # addition, never removal (L0: every pre-existing law stays in force).
          python scripts/fitness/check_pedagogy_engine.py
          # D-264 (2026-08-16 · decision of the owner · ISS-178→ISS-181): the
          # adaptive study planner constitution. A paper weekly planner (goals,
          # seven day boxes, notes) is not a feature -- it is an Adaptive AI
          # Study Planner: the student states goals, the system diagnoses them
          # (BKT/FSRS), divides them across the week with a deterministic
          # zero-LLM scheduler, tracks completion, and replans from the
          # student's actual performance. Ten laws L1–L10: measurable goals,
          # zero-LLM time division (FSRS retention, never randomness), upcoming
          # exam closes the dates, spaced review before any new promise, no
          # evidence-free promises, live E2E proof before the feature ships.
          # Law in `.memory/adaptive_study_planner_constitution.md`; addition,
          # never removal -- D-263's tutorial loop guards the planner cycle itself.
          python scripts/fitness/check_adaptive_study_planner.py
          # D-265 (2026-08-16 · decision of the owner · ISS-182→ISS-185): the
          # Spec Kit governance constitution. Spec Kit (github.com/spec-kit,
          # MIT, 120k+ stars) is adopted as an EXECUTION-GOVERNANCE LAYER above
          # the existing constitutions, not a replacement: plan → design →
          # tasks → spec → implement → prove. Ten laws L1–L10: spec updated
          # with the push itself, measurable contract not prose, every named
          # enforcer actually exists (no orphan, no phantom), proof before
          # acceptance, migration before use, API contract never breaks
          # silently, tracing as an acceptance condition, secrets outside the
          # repo forever, impact in decisions, numbers never handwritten.
          # Law in `.memory/spec_kit_governance_constitution.md`; addition,
          # never removal -- D-153/D-263/D-264 all remain in force.
          python scripts/fitness/check_spec_kit_governance.py

          # D-266 (ISS-186): the repo demands a three-legged proof of every
          # capability -- import + call chain + runtime evidence -- and demanded
          # none of it from its own enforcers. Measured on 2026-08-16: seven of
          # seventy gates were run by no workflow and no test. They existed, they
          # were cited constitutionally, and they were dead. `check_spec_kit_
          # governance` (L3) checks mention + existence, never execution, so a
          # dead gate passed the "no orphan enforcer" check while enforcing
          # nothing. `run_fitness_gates.py` reads this workflow, so an unlisted
          # gate is dead locally too -- it does not protect, and it is not
          # neutral either: it grants false confidence. The seven are wired
          # immediately below; this gate makes an eighth impossible.
          python scripts/fitness/check_governance_registry.py

          # ── The seven that were dead (D-266) ─────────────────────────────
          # Each was verified green on Python 3.12 (this job's version) before
          # being wired. They are listed individually, not looped, so that a
          # failure names the law it broke.
          #
          # Emergency legacy profile stays out of the default compose stack.
          python scripts/fitness/check_core_kernel_env_profile.py
          # Legacy route count is hard-zero and monotonic (Strangler phase 3).
          python scripts/fitness/check_legacy_routes_monotonic.py
          # Refuses phase-5 decommission while traffic is unmeasured -- a zero
          # here would mean "nobody counted", not "nobody called".
          python scripts/fitness/check_legacy_traffic_zero_window.py
          # D-WS-SECRET-KEY-001: one signing key, one source (K-ROOT / D-241).
          python scripts/fitness/check_secret_key_consistency.py
          # Chat HTTP+WS really run through the StateGraph backbone.
          python scripts/fitness/check_stategraph_runtime_backbone.py
          # Consumer/provider contract baseline is complete and verified.
          python scripts/fitness/check_contracts_verified.py
          # D-266 (ISS-159): one authority decides "is this probability?".
          # The old guard was `_c is not None and _c.canonical_id != "probability"`
          # in SIX places, over a retrieval registry that knows three maths topics
          # and zero physics -- so a physics question returned None, the condition
          # collapsed at its first leg, and the guard never ran. This gate makes a
          # seventh copy impossible rather than merely discouraged, and inherits
          # D-193's enforcement, whose named gate (`check_curriculum_single_source`)
          # was cited in the source for months and never written.
          python scripts/fitness/check_topic_authority_single_source.py

          # D-267 (2026-08-18 · decision of the owner · ISS-187→ISS-190): the
          # NAAS Verification Layer constitution. The verifier is a PRODUCT with
          # its own architectural boundary — the platform's barème, item bank and
          # BKT/FSRS stay reusable technical assets, never a proven commercial
          # moat. The investment report that founded this decision named its own
          # weakest link honestly: NOT FOUND, an independent paid audit contract.
          # The chain breaks at REAL PAYMENT, not at the problem or the budget.
          # So the gate enforces a deterministic six-state machine (ABSENT →
          # PENDING → CLEARED | BLOCKED → EXPIRED | REASSESS_REQUIRED; vague
          # tokens like "probably-cleared" are red, and ABSENT → CLEARED is a
          # refused jump), evidence schema conformance where `expires_at` is
          # DERIVED from issued_at + validity_days, quantitative thresholds
          # (Δ ≥ 15% over a pinned baseline with runs ≥ 3; ≥ 3 exploit classes
          # with DISTINCT root causes — three variants of one root are not three
          # classes; a settled transaction, never stars or an unpaid LOI), and
          # the credibility limit: no unfalsifiable claim, no price without a
          # PRICING HYPOTHESIS tag. Two structural rules matter most: CI verifies
          # evidence and never decides law (a machine as `issuer` is a blank
          # cheque signature), and the legal gate blocks EXTERNAL COMMERCIAL
          # ACTIONS ONLY — local development, synthetic/open-data experiments and
          # benchmark building stay green, because governance exists to stop us
          # deceiving ourselves, not to stop the work.
          python scripts/fitness/check_naas_verification.py

          # D-268 (ISS-191): "capture the secret automatically, like Supabase and
          # OpenRouter" turned out not to name one thing. A secret crosses TEN
          # doors between a GitHub account and the process, and the doors did not
          # agree. Measured 2026-08-19: SUPABASE_EDGE_FUNCTION_URL/KEY are injected
          # by supervisor.sh and documented in secrets.env.example but MISSING from
          # devcontainer.json:remoteEnv — so setting them as Codespaces secrets
          # never reached the container at all. TAVILY_API_KEY crossed six doors
          # with no AppSettings field, so app/ read it through os.environ in two
          # places, breaking §6 ("never use os.environ in app code") — a rule that
          # was prose with no enforcer, the D-188 defect class. FIRECRAWL_API_KEY is
          # read in app/ and captured by no door at all, so it is always None.
          # config/secret_catalog.json is now the single source, and this gate makes
          # a forgotten door impossible rather than merely discouraged. It also
          # feeds check_no_committed_secrets its patterns, so a new provider key
          # (hch-v3-… was invisible to it) can no longer be committed.
          python scripts/fitness/check_secret_capture_parity.py
          # D-269 (ISS-192/193): a third-party user-modelling layer (Honcho) entered
          # the repo, and it touches §0.12 and §0.14 at their core on a platform
          # serving minors. The danger is not a wrong wiring but a GRADUAL one: a
          # line sending an id, then a line sending a snippet "for context", then
          # months later student conversations are crossing to a third party. That
          # is exactly ISS-146's shape (system text written with role=user 28 times
          # before anyone noticed). So the content wall is structural, not a filter:
          # the layer's own types carry no field that could hold a message, and this
          # gate proves it by AST. It also enforces the reverse direction — a unit
          # declared SEAM that HAS code is red — because live code with no guard and
          # no test is worse than a declared absence.
          python scripts/fitness/check_ambient_identity.py

      - name: Run architectural guardrails (part 9)
        shell: bash
        run: |
          set -euo pipefail
          # ── D-270 (معايير التسليم — المصدر: OpenHands) ──────────────────────
          # L6: سلسلة التوريد. القياس 2026-08-19 وجد `dependabot.yml` يخرق ثلاثة
          # معايير معاً: بلا `cooldown` إطلاقاً (نسخةٌ رُفعت قبل ساعة تُدمَج آلياً —
          # باب الحزمة المُختطَفة)، ويستهدف `/ai_service` وهو مجلّدٌ **غير موجود**،
          # ويجمع `flask*`/`chromadb*` ولا حزمة منهما في أيّ `requirements*.txt`.
          # وأخطرها الرابع: `frontend/package.json` (١٠ تبعيات) لم يكن مُغطّى
          # إطلاقاً — والناقص يُلاحَظ، أمّا التغطية التي تبدو شاملة فلا يسألها أحد.
          # ودَين التثبيت (١٦٠ تبعية بلا `==`) مُجمَّد ويتقلّص في الاتجاهين، لأن
          # فرضه دفعةً واحدة ترقيةٌ جماعية غير مُختبَرة — وثمن الإهمال مُثبَتٌ حيّاً
          # في D-184: نطاقٌ عائم لـruff أحمرَّ به `main` بلا تغيير سطرٍ واحد.
          python scripts/fitness/check_supply_chain.py
          # L8: حدّ المصداقية يمتدّ إلى ما يُشحَن. D-227 فرضه على الوثائق المُعلَنة
          # وحدها، فبقيت ملفّات الإعداد خارج كل مرمى: أربعة ادّعاءات غير قابلة
          # للتفنيد (صفة تفوّقٍ بشري · مقارنةٌ بمنافسين بلا قياس · استعارةُ سلطةٍ
          # أمنية · ادّعاءُ ملكية نماذج) عاشت في ملفّين يُشحَنان مع كل نسخة —
          # ومعها وعدٌ بتغطية مجلّدٍ غير موجود. النصّ الحرفي في السجلّ القانوني،
          # ولا يُقتبَس هنا: تعليقٌ يقتبس العبارة يُفشِل بوّابته (اكتُشِف بالتشغيل).
          # والأسوأ أن قائمة العبارات كانت **ثلاث نسخ في ثلاث بوّابات** لا تتّفق
          # أيّ اثنتين منها (المشترك عبارتان فقط) — نفس صنف ISS-139 لكن داخل
          # الفوارض نفسها. فالمصدر الآن `docs/governance/CREDIBILITY_LIMIT.json`،
          # والبوّابة تُثبت تكافؤ الثلاث معه بلا تغيير سلوكها.
          python scripts/fitness/check_config_credibility.py

          # L4: البوّابة تُثبِت أنّها تحجب. ISS-148 هي الدرس المؤسِّس — عقودٌ خضراء
          # ومسارُ التسريب خارج مرمى كلّ واحدٍ منها، فالخُضرة كانت دليل عمى لا سلامة.
          # وD-266 فرض أن تُشغَّل البوّابات؛ وبقي السؤال الأصعب بلا فارض: هل تحجب حين
          # يُخرَق قانونها؟ القياس 2026-08-19: من ٧٧ بوّابة، ٢٦ فقط لها اختبارٌ يؤكّد
          # فشلاً، و٢٠ مذكورةٌ في اختبارٍ يتوقّع **نجاحها** (يُثبِت أنّها تعمل لا أنّها
          # تحجب)، و٣١ بلا أيّ اختبار. الدَّين مُجمَّد ويتقلّص في الاتجاهين لأنّ كتابة
          # ٥١ برهاناً في دفعةٍ واحدة أخطر من الدَّين المُعلَن.
          python scripts/fitness/check_gate_negative_proof.py
          # L5: الحرفية السحرية. دُفِع الثمن أربع مرّات (D-185 رمزٌ بلا تعريف · D-186
          # ثلاث قوائم لنيّةٍ واحدة · D-191 حرفيةٌ في ٧ مواضع تُغذّي ١٢ نقطة استدعاء ·
          # D-193 ثلاثة تعاريف لـconcept_id أسقطت الفيزياء كلّها إلى "general")، وفي
          # كلّ مرّة كُتِبت بوّابةٌ للحادثة لا للصنف. هذه تُعمّم القاعدة قبل الخامسة.
          python scripts/fitness/check_no_magic_strings.py

          # ISS-199: التأجيل يُصرَّح، ولا يُعمَّر بعد بلاغه. وصلت `3176fe6` وظيفة
          # `live-e2e` بـ`required-ci` ولم تلمس رأس `live-e2e.yml` القائل «ليس في
          # required-ci» — فصارت بوّابةٌ حاجبة مُوجَّهةً إلى ISS-150 وهو 🔴 مفتوحٌ
          # بقرارٍ مكتوبٍ بتأجيله، فامتنع الأخضر على كل دفعة بالبناء. والعلاج تصريحُ
          # المؤجَّل في موطنٍ واحد: بلاغٌ أُغلق وبقي مؤجَّلاً ⇒ أحمر (D-188)، وسببٌ
          # فارغ ⇒ أحمر (D-206 L11)، وقائمةٌ ثانية في سكربتٍ آخر ⇒ أحمر (D-186).
          python scripts/fitness/check_e2e_deferred_findings.py

          # ── D-271 (معايير الوكلاء المفتوحة — المصدر: anthropics/skills · adk-python) ──
          # L9/L10/L11: كلمة «مهارة» تعني شيئين في هذا المستودع — BaseSkill يعمل في
          # مسار الطالب، وAgent Skill مجلّدٌ يوجّه وكيلاً لغوياً. واسمٌ واحد لبنيتين هو
          # ما يحذّر منه D-209 وما أنتج ISS-139. فالمسرد مُعلَن ومفروض، والمهارات على
          # المعيار المفتوح (agentskills.io)، ولكلٍّ **حالة تقييمٍ مُصرَّحة**: الساق
          # السادسة بعد الخمس في §0.5 — المهارة تُقاس ولا تُعلَن.
          python scripts/fitness/check_agent_skills_spec.py
          # L12: التبنّي بقرارٍ مكتوب لا بإعجاب. ISS-193 فُتِحت حرفياً على «تبنّي harness
          # خارجي بلا قرارٍ مكتوب»؛ وقائمةٌ من عشرة مستودعاتٍ لامعة تُقرأ إعجاباً بدل
          # عقدٍ تتحوّل إلى دَينٍ معماري. كل مصدرٍ صفٌّ بما اُستُعير وما رُفض ولماذا،
          # وبفارضٍ مُسمّى أو إعلانِ غيابه — والفحص في الاتجاهين: ABSENT وله كود ⇒ أحمر.
          python scripts/fitness/check_external_standards.py
          # ── D-272 (مبادئ تصميم الأنظمة الوكيلية — المصدر: arXiv:2512.08296) ──
          # قياسٌ مضبوطٌ لـ260 تشكيلةً (Google Research · DeepMind · MIT): «كلما زاد
          # عدد الوكلاء كان النظام أذكى» خرافةٌ لها ثمنٌ مقاس — −70% على المهام
          # التسلسلية · 17.2× تضخيمًا للأخطاء في الأنظمة المستقلة · عوائدٌ سالبةٌ فوق
          # عتبة ~45% لنجاح خط الأساس. الدستور D-272 ملزمٌ لا استشاري: الوكيل الواحد
          # أولًا وكخط أساسٍ دائم · البنية تختار بمطابقة بنية المهمة لا بالذوق · لا
          # مسوداتٍ مشتركةً في المستقل · إعادة معايرةٍ بعد كل ترقيةٍ للنموذج · والهدف
          # نتيجةٌ أفضل بأقل تعقيدٍ وتكلفة. هذه البوابة تجعل وصفَ بنيةٍ وكيليةٍ بلا
          # إثباتِ الامتثال مستحيلًا — لا مجرد غير مستحسن.
          python scripts/fitness/check_agentic_design_principles.py
          # Third, strictest copy of the boundary rule (app ⇸ microservices).
          # Kept because it is AST-strict where the other two are scoped; it
          # reported 34 "violations" under 3.11 that were all PEP-695 parse
          # failures, i.e. unreadable-reported-as-dirty. On 3.12 it is clean.
          python tools/ci/check_import_boundaries.py
  # ── D-105 (ISS-113): the test suite runs as TWO parallel jobs ──────────────
  # `tests/conftest.py::pytest_collection_modifyitems` deliberately orders
  # microservices tests last *within one process* (SQLAlchemy table-registry
  # isolation), which makes pytest-xdist unsafe. Job-level splitting is the
  # safe parallelism: each job is a fresh process with its own ordering.
  #
  # Deselect-list history: the original 40-entry PRE_EXISTING_FAILURES list
  # was burned down in D-105 —
  #   * 12 × test_orchestrator_client_resilience — REWRITTEN onto the current
  #     chat_with_agent contract (D-025/D-047/D-049 era) and re-enabled.
  #   * 11 × isolation failures (test_settings, kernel CORS, settings_refactor,
  #     phase0_governance) — ROOT-CAUSE FIXED (APP_DATABASE_URL collection-time
  #     poison, isolated_helpers env restore, teardown_module leak,
  #     sys.executable in subprocess gates) and re-enabled.
  # The remaining entries are contract-drift rewrites tracked as follow-up.
  # Do NOT widen these lists silently — every entry must be a pre-existing
  # failure that has been red on main, not a regression from a later PR.
  test-monolith:
    name: test-monolith
    runs-on: ubuntu-latest
    # 20 was a coin flip, not a budget. Measured on this repo: the test step took
    # 13m50s on the last green `main` run and 12m13s here, but a slow runner
    # stretched the identical commit past 18m and the job was killed at the wall.
    # A cap that close to the median converts runner variance into red builds and
    # teaches everyone to re-run until it passes -- which is how a gate stops
    # meaning anything. 30 kept the job bounded but a slow runner stretched the
    # identical suite to 27m39s and the job was killed at 30m01s AFTER all 4397
    # tests had already passed (73.6% coverage) -- a red gate over a green run is
    # exactly what D-105 forbids. 45 leaves real headroom; the way to bring it
    # back down is to make the suite faster, not to shave the cap.
    timeout-minutes: 45
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: ./.github/actions/setup
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run monolith tests (tests/ minus microservices + scripts/ci)
        shell: bash
        run: |
          set -euo pipefail
          MONOLITH_DESELECTS=(
            # Contract-drift rewrites tracked as follow-up (red on main).
            # ISS-147 — flaky, NOT a new break. test_redeeming_a_bad_code_over_http
            # asserts 400 and intermittently gets 401. D-105 permits a new deselect
            # only with proof of "red on main" plus a root-cause note, so here is the
            # proof: the same two files in the same order, ten runs on untouched main
            # (b770289), fail 1/10 — identical to the rate on this branch. It predates
            # this work and fails the whole 4161-test job on a coin flip.
            #
            # Root cause honestly unknown. Four hypotheses were tested and all four
            # were wrong: lastrowid in the fixture (switched to RETURNING id anyway,
            # since CLAUDE.md mandates it — rate unchanged), settings-cache clearing,
            # session/connection visibility, and releasing the shared StaticPool
            # connection after commit. It also refuses to reproduce under -s, which
            # points at interleaving rather than logic.
            #
            # Scoped to the single test, not the file: the other 22 guardian tests
            # keep guarding D-195/D-196. This line is debt — it comes out when
            # ISS-147 is diagnosed, and the list only shrinks.
            --deselect tests/services/test_guardian_dashboard.py::test_redeeming_a_bad_code_over_http_is_a_400
            # ISS-147, second instance (ISS-148 run, f306032): the SAME flake in the
            # adjacent test — `assert 401 == 404`, 1 failed of 4162. The two are
            # structurally identical: same four fixtures
            # (event_loop, client, db_session, register_and_login_test_user),
            # twelve lines apart, both mint a token then call an endpoint over HTTP.
            # Whatever makes the committed user invisible to the worker thread hits
            # whichever of them runs when the interleaving goes wrong; quarantining
            # one just moved the failure to its neighbour.
            #
            # NOT caused by that PR's `app/core/db_schema.py` change, and this was
            # measured rather than assumed: the old and new implementations were run
            # against the identical sqlite config CI uses, and produce byte-identical
            # table sets (33 tables, same names). The new code only diverges where
            # the old one aborted the whole transaction — which never happens here.
            --deselect tests/services/test_guardian_dashboard.py::test_revoking_an_unlinked_student_over_http_is_a_404
            --deselect tests/architecture/test_governance.py::test_governance_contracts_any
            --deselect tests/integration/test_import_conversation.py::test_import_new_conversation_returns_imported
            --deselect tests/integration/test_import_conversation.py::test_import_twice_returns_already_exists
            --deselect tests/integration/test_import_conversation.py::test_import_wrong_user_id_returns_not_found
            # D-182: test_assess_understanding_success re-enabled (green again; list shrank).
            # Teardown-only failure: the test itself PASSES but the
            # SQLAlchemy/aiosqlite connection cleanup races with a daemon
            # thread on test exit. Tracked as follow-up.
            --deselect tests/test_admin_chat_error_handling.py::test_chat_error_handling_with_auth_but_service_error
            # Live WebSocket integration tests gated by a module-level
            # skipif(<server not running>) — they can never run in CI and the
            # strict no-skip policy in conftest would fail the session.
            --ignore=tests/integration/test_bac_exercise_websocket.py
          )
          # D-105/D-182/D-183/D-203: أرضية التغطية — ratchet أحادي الاتجاه نحو 100%
          # (خارطة الطريق: .memory/coverage-roadmap.md) — لا تخفّضها أبداً.
          # قياس محلي 2026-08-01: **73.41%** على app/ (4087 اختباراً، 0 فشل، نفس قائمة
          # الـdeselect أدناه). الأرضية تُرفَع 71→73 على **قياس** لا تقدير: رفعُها على
          # رقمٍ مكتوب في وثيقة هو بالضبط ما يجعل البوّابة تكذب (D-192).
          # الهامش المتروك (~0.4pt) مقصود: تغطية تتذبذب قليلاً مع ترتيب الاختبارات،
          # وأرضيةٌ ملاصقة للقياس تُحوِّل التذبذب إلى فشلٍ عشوائي — والبوّابة التي
          # تفشل عشوائياً تُطفَأ.
          python -m pytest tests scripts/ci -v \
            --ignore=tests/microservices \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=73 \
            --durations=10 \
            --tb=short \
            "${MONOLITH_DESELECTS[@]}"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # D-234: deliver the coverage report that already exists.
  #
  # The CodeScene GitHub App opens a `CodeScene Code Coverage` check on every commit
  # and waits for a report. Nothing in this repository ever sent one, so the check sat
  # queued for hours and then concluded `timed_out` — a FAILED check — with CodeScene's
  # own words: "No valid coverage report found in the build pipeline." Meanwhile
  # `test-monolith` above has been producing a perfectly good cobertura report the whole
  # time and parking it in an artifact nobody consumed. The data existed; only the
  # delivery was missing.
  #
  # A check that can only ever time out is the CI form of a zombie metric (D-016):
  # worse than absent, because it reads as a real signal.
  #
  # Why a separate job instead of a step in `test-monolith`: on `pull_request`,
  # actions/checkout gives you the MERGE commit, but the CodeScene check is registered
  # against the PR HEAD (visible in its own details URL: `...&commit-sha=<head>`).
  # `cs-coverage` infers the commit from git HEAD and has no documented SHA flag, so
  # uploading from the merge commit delivers data CodeScene cannot match to the pending
  # check — the same failure with extra steps.
  #
  # ⛔ Deliberately absent from `required-ci`: a third-party outage must not block merges.
  codescene-coverage:
    name: codescene-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-monolith
    if: always() && needs.test-monolith.result != 'cancelled'
    env:
      # `secrets` is not available in `if:`; surfacing it as env is the supported way to
      # branch on presence, so fork PRs skip instead of failing.
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # cs-coverage reads git to identify repo + commit
      # Checking out a raw SHA leaves a detached HEAD, and `cs-coverage` reads the branch
      # from git. The first successful upload proved it, in CodeScene's own words:
      #
      #   Usage error: It seems you upload for repo '...' and branch: 'HEAD' but CodeScene
      #   only analyse the following branches: ("main") of this repo!
      #
      # The data was accepted (691 files parsed) but attributed to a branch that does not
      # exist. Naming the local branch after the real one costs one command.
      - name: Restore the branch name lost by the detached checkout
        # The branch name goes through `env`, never into the `run` template. A PR head
        # ref is attacker-controlled metadata, `${{ }}` is expanded before bash starts,
        # and this job carries CS_ACCESS_TOKEN — so a branch named with shell
        # metacharacters would run as code with the token in scope. Same law as D-187:
        # make the injection unrepresentable instead of filtering for it.
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH_NAME"
          echo "branch: $(git rev-parse --abbrev-ref HEAD)"
      - uses: actions/download-artifact@v8
        id: coverage
        # `test-monolith` runs with `if: always()`, so a collection error there leaves no
        # artifact at all (measured on 08f0568: "No files were found with the provided
        # path: coverage.xml"). A hard failure here would paint this job red for someone
        # else's problem, so the miss is tolerated and then reported below.
        continue-on-error: true
        with:
          name: coverage-report # produced above — no second test run, no second number

      # D-235: a skipped upload and a successful upload were indistinguishable — both left
      # this job green. It skipped on every single run from the day it was written, because
      # the secret did not exist yet, and nothing said so. Green is not allowed to mean
      # "did nothing" (§0 — no silent failure; L11 — absence declares its reason).
      - name: Report a missing token instead of skipping in silence
        if: env.CS_ACCESS_TOKEN == ''
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=CodeScene upload skipped::CS_ACCESS_TOKEN is empty — nothing uploaded."
          {
            echo "### CodeScene coverage — skipped, not uploaded"
            echo
            echo "\`secrets.CS_ACCESS_TOKEN\` resolved to an empty value."
            echo "Expected on pull requests from forks, which receive no secrets."
            echo "On a same-repo run it means the secret is missing — and the"
            echo "\`CodeScene Code Coverage\` check will sit pending until it times out."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a missing coverage report
        if: steps.coverage.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=No coverage artifact::test-monolith produced no coverage.xml — nothing to upload."
          {
            echo "### CodeScene coverage — no report to send"
            echo
            echo "The \`coverage-report\` artifact is missing, which means \`test-monolith\`"
            echo "failed before pytest could write \`coverage.xml\` (a dependency-resolution"
            echo "or collection error, not a test failure). Fix that job first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != '' && steps.coverage.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          # Not `curl | sh`: fetch the installer to a file first so a download failure is
          # loud and the script is readable in the log (the spirit of D-187 — no implicit
          # network, no blind execution).
          curl -fsSL -o install-cs-coverage-tool.sh \
            https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
          sh install-cs-coverage-tool.sh -y
          "$HOME/.local/bin/cs-coverage" upload \
            --format cobertura --metric line-coverage coverage.xml
          # Say it landed. The whole point of this job is that "green" now carries
          # information, and a reader should not have to expand a step to learn which.
          {
            echo "### CodeScene coverage — uploaded"
            echo
            echo "Sent \`coverage.xml\` (cobertura, line-coverage) for commit"
            echo "\`${{ github.event.pull_request.head.sha || github.sha }}\`."
            echo
            echo "Scope note: coverage is measured with \`--cov=app\` only. \`microservices/\`"
            echo "and \`shared/\` are NOT measured — if CodeScene shows them as 0% rather than"
            echo "as absent, the number is lying and the scope must be narrowed (D-197)."
          } >> "$GITHUB_STEP_SUMMARY"

  test-microservices:
    name: test-microservices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: test-secret-key-for-ci-pipeline-secure-length
      ENVIRONMENT: testing
      LLM_MOCK_MODE: "1"
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: dummy-key-for-ci
      RECOVERY_ADMIN_PASSWORD: dummy-pass-for-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: ./.github/actions/setup
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run microservices tests (tests/microservices + microservices/*/tests)
        shell: bash
        run: |
          set -euo pipefail
          MICROSERVICES_DESELECTS=(
            # Contract-drift rewrites tracked as follow-up (red on main).
            --deselect tests/microservices/orchestrator_service/test_routing.py::test_general_knowledge_node_uses_resolved_state_query
            --deselect tests/microservices/test_agent_chat_contract.py::test_agent_chat_admin_path_forwards_aligned_admin_state
            # D-182: the 2 test_conversation_service_capabilities deselects were removed —
            # the stub `capability_level`/`parity_ready` health fields were dropped when the
            # service was promoted to a full Skill (D-042); the tests now assert the current
            # promoted contract and are green (deselect list shrank).
            --deselect tests/microservices/test_conversation_service_journey.py::test_conversation_ws_synthetic_journey_customer
            --deselect tests/microservices/test_exercise_visibility_regression.py::test_exercise_request_is_visible_on_stream
            # D-168: the 3 test_orchestrator_chat_stategraph deselects were removed —
            # FakeGraph now implements astream (ISS-STREAM-002 contract) + STATE_DIR
            # points at tmp_path, so the trio is green again (deselect list shrank).
            # Live tests that connect to localhost:8000/8003 — no services run
            # in CI; they call pytest.skip() internally which trips the strict
            # no-skip policy. They remain runnable locally against a live stack.
            --deselect tests/microservices/test_websocket_gateway_routing.py::TestLiveWebSocketRouting::test_gateway_ws_returns_101
            --deselect tests/microservices/test_websocket_gateway_routing.py::TestLiveWebSocketRouting::test_conversation_service_ws_returns_101
            --deselect tests/microservices/test_websocket_gateway_routing.py::TestLiveWebSocketRouting::test_gateway_ws_not_404
          )
          python -m pytest tests/microservices microservices -v \
            --durations=10 \
            --tb=short \
            "${MICROSERVICES_DESELECTS[@]}"
      - name: OpenAPI parity (API-first — every service has a committed contract, D-173)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fitness/check_openapi_parity.py

  # ── Frontend regression tests (D-105) ─────────────────────────────────────
  # Deterministic node test files (zero npm dependencies — pure source
  # inspection + behavior replicas). Previously they only ran inside
  # issue-specific gates; now they gate every PR.
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run frontend node tests
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for f in frontend/tests/*.test.mjs; do
            echo "── node $f"
            if ! node "$f"; then
              echo "❌ FAILED: $f"
              failed=1
            fi
          done
          exit "$failed"
      # D-173: folded from iss-102-ws-double-handshake-gate.yml —
      # server.js must parse and the lockfile must stay in sync (`ws` dep
      # missing from package-lock broke npm ci in D-WS-PROXY-004).
      - name: server.js syntax + lockfile sync
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/server.js
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          echo "✅ server.js parses + package-lock.json in sync"
      # D-185: the frontend now consumes the committed OpenAPI contracts as generated
      # TypeScript types. Two gates: the generated file must match the contracts, and
      # the TS sources must type-check. A contract drift becomes a compile error here
      # instead of a runtime surprise in a student's browser.
      - name: OpenAPI-generated frontend types are current
        shell: bash
        run: python scripts/contracts/generate_frontend_types.py --check
      - name: TypeScript typecheck
        shell: bash
        run: npm run typecheck --prefix frontend
      # D-199: البناء نفسه لم يكن في CI إطلاقاً — أي خطأ يظهر أوّل مرّة في متصفّح
      # طالب. ومعه ميزانية حجم: الحزمة تنمو بهدوء حتى تصير غير قابلة للتحميل على 3G،
      # وهي شبكة معظم مستخدمينا. الميزانية تجعل النموّ قراراً لا مفاجأة.
      - name: Frontend production build + bundle budget
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix frontend
          python scripts/fitness/check_bundle_budget.py

  # ── Microservices Skills Structural Check ─────────────────────────────────
  skills-structural:
    name: skills-structural
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify Skills Architecture structural invariants
        shell: bash
        run: |
          set -euo pipefail

          echo "=== 1. Every Skill has prom_metrics.py ==="
          SKILLS=(orchestrator_service user_service planning_agent conversation_service research_agent reasoning_agent content_retrieval_skill)
          FAILED=0
          for skill in "${SKILLS[@]}"; do
            # NOTE: GNU find has no `-q` option — earlier versions of this gate
            # passed `-q` and silently treated every skill as missing. Use a
            # straight quiet match instead.
            if find "microservices/${skill}" -name "prom_metrics.py" 2>/dev/null | grep -q .; then
              echo "PASS: ${skill} has prom_metrics.py"
            else
              echo "FAIL: microservices/${skill} missing prom_metrics.py"
              FAILED=1
            fi
          done

          echo "=== 2. Every Skill has /health in main.py ==="
          for skill in "${SKILLS[@]}"; do
            # Prefer the canonical top-level main.py; `find | head -1` is
            # non-deterministic (services have a nested graph/main.py too).
            main="microservices/${skill}/main.py"
            if [ ! -f "$main" ]; then
              main=$(find "microservices/${skill}" -name "main.py" 2>/dev/null | head -1)
            fi
            if [ -z "$main" ]; then
              echo "FAIL: microservices/${skill} missing main.py"
              FAILED=1
            elif ! grep -q "health" "$main"; then
              echo "FAIL: ${skill}/main.py missing /health endpoint"
              FAILED=1
            else
              echo "PASS: ${skill} has /health"
            fi
          done

          echo "=== 3. Prometheus config has ≥ 12 scrape jobs ==="
          count=$(grep -c "job_name:" observability/native/prometheus.yml || echo 0)
          if [ "$count" -lt 12 ]; then
            echo "FAIL: Only ${count} Prometheus scrape jobs (need ≥ 12)"
            FAILED=1
          else
            echo "PASS: ${count} Prometheus scrape jobs"
          fi

          echo "=== 4. Grafana dashboards ≥ 16 ==="
          dash_count=$(find observability/grafana/dashboards -name "*.json" 2>/dev/null | wc -l)
          if [ "$dash_count" -lt 16 ]; then
            echo "FAIL: Only ${dash_count} Grafana dashboards (need ≥ 16)"
            FAILED=1
          else
            echo "PASS: ${dash_count} Grafana dashboards"
          fi

          exit $FAILED


  images-plan:
    name: "images — read the declared matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.plan.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: plan
        run: echo "names=$(python scripts/ci/image_matrix.py --names)" >> "$GITHUB_OUTPUT"

  images-build:
    name: "image: ${{ matrix.name }}"
    needs: images-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # D-205: until this job existed, no container image in this repository was ever
    # built by CI — 15 of them, including the one that serves students. The first
    # `docker build` would have happened on production day. One runner per image so
    # disk and layer cache stay per-image (three of these used to pull torch).
    strategy:
      fail-fast: false
      # 15 runners each booting a buildx builder means 15 simultaneous anonymous
      # pulls of moby/buildkit + the base images from Docker Hub, and Hub throttles:
      # the first full run lost planning-agent to `registry-1.docker.io: Client.Timeout
      # exceeded while awaiting headers` while its Dockerfile was perfectly fine. A
      # gate that fails on unrelated infrastructure teaches people to ignore it, so
      # cap the concurrency rather than retry into the same wall.
      max-parallel: 5
      matrix:
        name: ${{ fromJSON(needs.images-plan.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: img
        name: "Resolve the image's context and dockerfile"
        run: python scripts/ci/image_matrix.py --resolve "${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: "Build"
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          push: false
          load: true
          tags: cogniforge-smoke/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: "Smoke: the application actually imports"
        if: steps.img.outputs.smoke != ''
        # Building is not importing. A dependency missing from requirements.txt links
        # fine and fails on the first import — which, without this step, would happen
        # for the first time in front of a student. Env values come from the declared
        # matrix via --env-file, never through a shell (D-187).
        run: |
          set -euo pipefail
          python scripts/ci/image_matrix.py --env-file "${{ matrix.name }}" /tmp/smoke.env
          docker run --rm --env-file /tmp/smoke.env \
            --entrypoint python cogniforge-smoke/${{ matrix.name }}:ci \
            -c "import importlib, sys; importlib.import_module('${{ steps.img.outputs.smoke }}'); print('import ok')"

  event-stack-live:
    name: "Event stack — a REAL boot, not a config check"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # docker-fullstack-gate.yml validates YAML and never creates a container — cheap,
    # worth keeping, and not evidence. D-201 shipped Redpanda and Temporal into compose
    # and nothing ever started them, so the whole event stack sat DORMANT while a
    # workflow named "full-stack gate" reported green. GitHub runners have Docker; this
    # job uses it. Images are pull-only — no builds — so it stays fast.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Boot the event stack"
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml up -d \
            redpanda redpanda-topics postgres-temporal temporal

      - name: "Topic bootstrap succeeded (it may no longer swallow failures)"
        run: |
          set -euo pipefail
          # `redpanda-topics` is a one-shot container. A non-zero exit now means a
          # topic could not be created — which used to pass silently behind `|| true`
          # and left messages disappearing until retention expired.
          docker wait cogniforge-redpanda-topics > /tmp/topics_exit || true
          code=$(cat /tmp/topics_exit)
          docker logs cogniforge-redpanda-topics
          test "$code" = "0" || { echo "❌ topic bootstrap exited $code"; exit 1; }

      - name: "Install the messaging drivers"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-messaging.txt

      - name: "Verify: cluster health, topic shape, round trip, redelivery, DLQ"
        env:
          # 19092 is the EXTERNAL listener — see the advertised-address note in
          # docker-compose.yml. Dialling 9092 from the host would hand back an
          # unresolvable `redpanda:9092` and hang.
          KAFKA_BOOTSTRAP_SERVERS: "127.0.0.1:19092"
          VERIFY_TIMEOUT: "180"
          VERIFY_HEALTH_TIMEOUT: "60"
        run: python scripts/verify_event_stack_docker.py

      - name: "Logs on failure"
        if: failure()
        # --tail=40, not 200. The first failing run dumped ~600 lines of broker chatter
        # after the verifier's own output, so the actual diagnosis scrolled out of reach
        # and the cause had to be guessed. Keep the signal near the end of the log.
        run: docker compose -f docker-compose.yml logs --tail=40 redpanda redpanda-topics temporal

      - name: "Tear down"
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans

  live-e2e-required:
    name: "E2E Full Stack — real external services and user journey"
    uses: ./.github/workflows/live-e2e.yml
    with:
      matrix_only: false
    secrets: inherit

  runtime-truth-required:
    name: "Runtime truth — required drift check"
    uses: ./.github/workflows/runtime_truth.yml
    secrets: inherit

  required-ci:
    name: required-ci
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        contracts,
        guardrails,
        test-monolith,
        test-microservices,
        frontend-tests,
        skills-structural,
        event-stack-live,
        live-e2e-required,
        runtime-truth-required,
        # Both, deliberately. `images-build` is skipped when `images-plan` fails, and
        # skipped counts as success below — so listing only the build job would let a
        # broken matrix pass as green.
        images-plan,
        images-build,
      ]
    if: always() && !cancelled()
    steps:
      - name: Evaluate required checks
        shell: bash
        run: |
          set -euo pipefail
          echo "lint=${{ needs.lint.result }}"
          echo "contracts=${{ needs.contracts.result }}"
          echo "guardrails=${{ needs.guardrails.result }}"
          echo "test-monolith=${{ needs.test-monolith.result }}"
          echo "test-microservices=${{ needs.test-microservices.result }}"
          echo "frontend-tests=${{ needs.frontend-tests.result }}"
          echo "skills-structural=${{ needs.skills-structural.result }}"
          echo "event-stack-live=${{ needs.event-stack-live.result }}"
          echo "live-e2e-required=${{ needs.live-e2e-required.result }}"
          echo "runtime-truth-required=${{ needs.runtime-truth-required.result }}"
          echo "images-plan=${{ needs.images-plan.result }}"
          echo "images-build=${{ needs.images-build.result }}"

          # Allow skipped as a valid success state alongside success
          isValid() {
            [ "$1" = "success" ] || [ "$1" = "skipped" ]
          }

          if ! isValid "${{ needs.lint.result }}" || \
             ! isValid "${{ needs.contracts.result }}" || \
             ! isValid "${{ needs.guardrails.result }}" || \
             ! isValid "${{ needs.test-monolith.result }}" || \
             ! isValid "${{ needs.test-microservices.result }}" || \
             ! isValid "${{ needs.frontend-tests.result }}" || \
             ! isValid "${{ needs.skills-structural.result }}" || \
             ! isValid "${{ needs.event-stack-live.result }}" || \
             ! isValid "${{ needs.live-e2e-required.result }}" || \
             ! isValid "${{ needs.runtime-truth-required.result }}" || \
             ! isValid "${{ needs.images-plan.result }}" || \
             ! isValid "${{ needs.images-build.result }}"; then
            echo "❌ One or more required checks failed"
            exit 1
          fi

          echo "✅ All required checks passed"
          echo ""
          echo "Skills Architecture: ✅ Verified"
          echo "Frontend: all node regression suites (frontend/tests/*.test.mjs) ✅"
          echo "Microservices: 8 services | Prometheus: ≥12 targets | Grafana: ≥16 dashboards"
