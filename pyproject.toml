[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "migrations", "migrations_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF", "PL", "N", "TID", "RET", "ARG"]
# E501: Line too long (Often unavoidable with Arabic docs or URLs)
# E402: Module level import not at top of file (scripts need sys.path.append first)
# RUF001/2/3: Unicode characters (Arabic text triggers this, so we ignore it to allow Arabic)
# B008: Do not perform function call `Depends` in argument defaults (Standard FastAPI pattern)
# B027: Empty method in abstract base class (Standard Hooks pattern)
# SIM117: Use a single `with` statement with multiple contexts (Avoids httpx context issues)
# PLR0913: Too many arguments (Factory patterns often require this)
ignore = [
    "ARG001",
    "ARG002",
    "E402",
    "E501",
    "PLC0415",
    "PLR0913",
    "PLR2004",
    "PLW0603",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
    "B027",
    "SIM117",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "microservices"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# D-192 (roadmap §6.5.د D3) — ratchet, not amnesty.
#
# PLR0911/0912/0915 (too-many returns/branches/statements) were silenced
# **globally** and without a reason comment, so the guards against god-functions
# were off everywhere — including in files created tomorrow. Raising them repo-wide
# in one step would mean 215 findings across 110 files touching the live student
# path, which is how a lint bump turns into a rewrite.
#
# So the rules are ON by default and the current offenders are frozen here, file by
# file. New code cannot grow a god-function; existing code is paid down entry by
# entry. **This list shrinks only** — the same rule as the deselect lists (D-105),
# `_FROZEN_DEBT` (D-187), and the correlated-HTTP debt (D-189).
"app/api/routers/admin.py" = ["PLR0912", "PLR0915"]
# D-277 acceptance/governance gates: these validators intentionally orchestrate
# several independent evidence checks in one fail-closed entrypoint. Their branch
# debt is frozen and shrink-only; all other Ruff rules remain active.
"scripts/fitness/check_agent_context.py" = ["PLR0912"]
"scripts/fitness/check_code_acceptance.py" = ["PLR0912", "PLR0915"]
"scripts/fitness/check_dual_track_alignment.py" = ["PLR0912", "PLR0915"]
"scripts/fitness/check_source_adoption_matrix.py" = ["PLR0912", "PLR0915"]
